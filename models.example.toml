# Copy to models.toml in the RecapCLI directory. The legacy .env config is "default".
default = "default"

[models.backup]
protocol = "chat_completions"
model = "your-compatible-model-id"
base_url = "https://your-provider.example/v1"
api_key_env = "BACKUP_API_KEY"
tools = true
context_bytes = 262144
streaming = true
images = false

[models.responses]
protocol = "responses"
model = "your-responses-model-id"
api_key_env = "OPENAI_API_KEY"
tools = true
context_bytes = 262144
streaming = true
images = false

# Select a model and endpoint that support vision before using this profile.
[models.vision]
protocol = "chat_completions"
model = "your-vision-model-id"
api_key_env = "OPENAI_API_KEY"
images = true
streaming = true
context_bytes = 262144
