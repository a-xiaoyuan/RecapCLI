name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra tui

      - name: Compile
        run: uv run python -m compileall -q recapcli

      - name: Test
        run: uv run python -X utf8 -m unittest discover -s tests

      - name: Smoke
        run: |
          uv run python -X utf8 -m recapcli --version
          uv run python -X utf8 -m recapcli --help

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build
        run: |
          uv sync --locked --extra tui
          uv build

      - name: Install and run in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/recapcli-package-venv"
          . "$RUNNER_TEMP/recapcli-package-venv/bin/activate"
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          python -m pip install "${wheels[0]}[tui]"
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/check_installed.py"

      - name: Verify GitHub one-command installation
        if: github.event_name == 'push'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/recapcli-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/recapcli-bin
        run: |
          uv tool install --python 3.12 "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}" --with "textual>=8,<9"
          cd "$RUNNER_TEMP"
          "$UV_TOOL_BIN_DIR/recapcli" --version
          "$UV_TOOL_DIR/recapcli/bin/python" -I "$GITHUB_WORKSPACE/tests/check_installed.py"
