[project]
name = "recapcli"
version = "0.6.0"
description = "支持历史压缩、长期记忆检索、任务追溯和本地工具的终端代码 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35,<4",
    "httpx2>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "tomlkit>=0.13,<1",
    "rich>=14,<15",
    "pillow>=11,<14",
    "tree-sitter-language-pack>=0.13,<0.14",
    "pywinpty>=3,<4 ; sys_platform == 'win32'",
    "ptyprocess>=0.7,<1 ; sys_platform != 'win32'",
]

[project.scripts]
recapcli = "recapcli.tui.launch:dispatch"

[project.optional-dependencies]
tui = [
    "textual>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recapcli"]
